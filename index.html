<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dünya Savunması</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { background-color: #05050d; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { position: relative; width: 800px; height: 600px; box-shadow: 0 0 30px rgba(0, 150, 255, 0.3); border: 2px solid #1a2942; border-radius: 8px; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .stat-box { background: rgba(10, 15, 30, 0.85); border: 1px solid #00f0ff; padding: 8px 15px; border-radius: 5px; }
        .stat-label { font-size: 11px; color: #8ab4f8; text-transform: uppercase; }
        .stat-value { font-size: 18px; font-weight: bold; color: #fff; }
        .health-bar-container { width: 180px; height: 14px; background: rgba(255, 0, 0, 0.2); border: 1px solid #ff4444; border-radius: 7px; overflow: hidden; margin-top: 4px; }
        .health-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff4444, #00ff88); transition: width 0.2s; }
        .nuke-btn { pointer-events: auto; background: linear-gradient(135deg, #ff0055, #ff5500); border: none; color: white; font-weight: bold; padding: 10px 18px; border-radius: 5px; cursor: pointer; }
        .nuke-btn:disabled { background: #333; opacity: 0.5; cursor: not-allowed; }
        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 15, 0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 10; }
        .overlay-title { font-size: 36px; font-weight: 800; color: #00f0ff; margin-bottom: 10px; text-align: center; }
        .overlay-desc { font-size: 14px; color: #a0aab8; max-width: 80%; text-align: center; margin-bottom: 25px; line-height: 1.5; }
        .btn-primary { background: linear-gradient(135deg, #00f0ff, #0066ff); border: none; color: #000; font-weight: bold; font-size: 16px; padding: 12px 30px; border-radius: 25px; cursor: pointer; }
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 85%; margin-bottom: 20px; }
        .shop-item { background: rgba(20, 30, 50, 0.85); border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .shop-btn { background: #ffd700; border: none; color: #000; font-weight: bold; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .shop-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .level-announcement { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: #ffd700; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui-layer">
        <div class="hud-top">
            <div class="stat-box">
                <div class="stat-label">Dünya Sağlığı</div>
                <div class="health-bar-container"><div id="healthBar" class="health-bar-fill"></div></div>
            </div>
            <div class="stat-box" style="text-align: center;">
                <div class="stat-label">SEVİYE</div>
                <div id="levelTxt" class="stat-value" style="color: #ffd700;">1</div>
            </div>
            <div class="stat-box" style="text-align: right;">
                <div class="stat-label">Altın / Skor</div>
                <div class="stat-value"><span id="goldTxt" style="color: #ffd700;">0</span> 🪙 | <span id="scoreTxt">0</span></div>
            </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: flex-end;">
            <button id="nukeBtn" class="nuke-btn" disabled onclick="triggerNuke()">☢️ NÜKLEER PATLAMA (<span id="nukeTimer">5:00</span>)</button>
            <button class="btn-primary" style="padding: 6px 15px; font-size: 12px; pointer-events: auto;" onclick="openShop()">🛒 MAĞAZA</button>
        </div>
    </div>

    <div id="levelBanner" class="level-announcement">SEVİYE 1</div>

    <div id="overlay" class="overlay-screen">
        <div id="overlayTitle" class="overlay-title">DÜNYA SAVUNMASI</div>
        <div id="overlayDesc" class="overlay-desc">Asteroidler Dünya'ya yaklaşıyor! Uzay gemini A/D veya Sol/Sağ tuşlarıyla yönet, Boşluk (Space) ile ateş et!</div>
        <button id="startBtn" class="btn-primary" onclick="startGame()">BAŞLA</button>
    </div>

    <div id="shopOverlay" class="overlay-screen" style="display: none;">
        <div class="overlay-title" style="color: #ffd700;">MAĞAZA</div>
        <div class="shop-grid">
            <div class="shop-item">
                <div><b>Ateş Hızı</b><br><small style="color:#aaa">Daha hızlı ateş</small></div>
                <button id="buyFireRate" class="shop-btn" onclick="buyUpgrade('fireRate')">50 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>İkili Lazer</b><br><small style="color:#aaa">2 mermi atar</small></div>
                <button id="buyDoubleLaser" class="shop-btn" onclick="buyUpgrade('doubleLaser')">150 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Gemi Hızı</b><br><small style="color:#aaa">Manevra hızı</small></div>
                <button id="buySpeed" class="shop-btn" onclick="buyUpgrade('speed')">40 🪙</button>
            </div>
            <div class="shop-item">
                <div><b>Dünya Tamiri</b><br><small style="color:#aaa">+30 Can</small></div>
                <button id="buyRepair" class="shop-btn" onclick="buyUpgrade('repair')">80 🪙</button>
            </div>
        </div>
        <button class="btn-primary" onclick="closeShop()">SAVAŞA DÖN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function playSound(type) {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'laser') {
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'explosion') {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    let gameState = 'START', score = 0, gold = 0, level = 1, earthHealth = 100;
    let nukeCooldown = 300, nukeTimer = nukeCooldown, nukeReady = false, keys = {}, lastShotTime = 0;

    const ship = {
        x: 400, y: 520, width: 44, height: 44, speed: 5, fireRate: 400, hasDoubleLaser: false,
        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            ctx.fillStyle = Math.random() > 0.5 ? '#ff5500' : '#ffcc00';
            ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(0, 28 + Math.random() * 8); ctx.lineTo(6, 18); ctx.fill();
            ctx.fillStyle = '#00f0ff';
            ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(16, 16); ctx.lineTo(6, 12); ctx.lineTo(-6, 12); ctx.lineTo(-16, 16); ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#0066ff'; ctx.fillRect(-18, 8, 6, 10); ctx.fillRect(12, 8, 6, 10);
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, -4, 5, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    };

    let bullets = [], asteroids = [], particles = [], coins = [], boss = null;

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function startGame() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('shopOverlay').style.display = 'none';
        score = 0; gold = 0; level = 1; earthHealth = 100;
        asteroids = []; bullets = []; particles = []; coins = []; boss = null;
        ship.x = 400; ship.speed = 5; ship.fireRate = 400; ship.hasDoubleLaser = false;
        updateHUD(); gameState = 'PLAYING'; showLevelBanner("SEVİYE 1");
    }

    function showLevelBanner(text) {
        const banner = document.getElementById('levelBanner');
        banner.innerText = text; banner.style.opacity = '1';
        setTimeout(() => banner.style.opacity = '0', 2500);
    }

    function shoot() {
        const now = Date.now();
        if (now - lastShotTime > ship.fireRate) {
            if (ship.hasDoubleLaser) {
                bullets.push({ x: ship.x - 12, y: ship.y - 10, speed: 9 }, { x: ship.x + 12, y: ship.y - 10, speed: 9 });
            } else {
                bullets.push({ x: ship.x, y: ship.y - 20, speed: 9 });
            }
            playSound('laser'); lastShotTime = now;
        }
    }

    function spawnAsteroid() {
        if (gameState !== 'PLAYING') return;
        let type = 'normal', hp = 1, speed = 1.2 + Math.random() * 0.8, size = 20 + Math.random() * 15;
        if (level >= 2 && Math.random() < 0.3) { type = 'fire'; speed += 1.5; }
        if (level >= 3 && Math.random() < 0.25) { type = 'ice'; hp = 2; }
        if (level >= 4 && Math.random() < 0.2) { type = 'armored'; hp = 4; size += 15; speed *= 0.7; }
        asteroids.push({ x: Math.random() * 740 + 30, y: -40, size, speed, hp, maxHp: hp, type, angle: 0, rotSpeed: (Math.random() - 0.5) * 0.04 });
    }

    function spawnBoss() {
        boss = {
            x: 400, y: -100, targetY: 100, hp: 100, maxHp: 100,
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.fillStyle = '#4a0e4e'; ctx.beginPath(); ctx.ellipse(0, 0, 70, 40, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3; ctx.stroke();
                ctx.fillStyle = '#ff0000'; ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(200, 20, 400, 12);
                ctx.fillStyle = '#ff0055'; ctx.fillRect(200, 20, (this.hp / this.maxHp) * 400, 12);
            }
        };
    }

    function triggerNuke() {
        if (!nukeReady || gameState !== 'PLAYING') return;
        nukeReady = false; nukeTimer = nukeCooldown; document.getElementById('nukeBtn').disabled = true;
        asteroids.forEach(a => { createExplosion(a.x, a.y, '#ff5500', 15); coins.push({ x: a.x, y: a.y, amount: 10, vy: 1.5 }); });
        asteroids = []; if (boss) boss.hp -= 30;
    }

    function createExplosion(x, y, color = '#ff8800', count = 10) {
        playSound('explosion');
        for (let i = 0; i < count; i++) {
            particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, size: Math.random() * 4 + 2, color, alpha: 1 });
        }
    }

    function update() {
        if (gameState !== 'PLAYING') return;
        if (keys['KeyA'] || keys['ArrowLeft']) ship.x -= ship.speed;
        if (keys['KeyD'] || keys['ArrowRight']) ship.x += ship.speed;
        if (keys['Space']) shoot();
        ship.x = Math.max(22, Math.min(778, ship.x));

        if (!nukeReady) {
            nukeTimer -= 1 / 60;
            if (nukeTimer <= 0) { nukeReady = true; document.getElementById('nukeBtn').disabled = false; }
            const mins = Math.floor(nukeTimer / 60), secs = Math.floor(nukeTimer % 60).toString().padStart(2, '0');
            document.getElementById('nukeTimer').innerText = `${mins}:${secs}`;
        }

        bullets.forEach((b, i) => { b.y -= b.speed; if (b.y < -10) bullets.splice(i, 1); });
        coins.forEach((c, i) => {
            c.y += c.vy;
            if (Math.hypot(ship.x - c.x, ship.y - c.y) < 60) { c.x += (ship.x - c.x) * 0.1; c.y += (ship.y - c.y) * 0.1; }
            if (Math.hypot(ship.x - c.x, ship.y - c.y) < 20) { gold += c.amount; coins.splice(i, 1); updateHUD(); }
        });

        if (score > level * 300 && level < 5) { level++; showLevelBanner(`SEVİYE ${level}`); if (level === 5) spawnBoss(); }

        if (boss) {
            if (boss.y < boss.targetY) boss.y += 1;
            boss.x += Math.sin(Date.now() / 500) * 2;
            bullets.forEach((b, bi) => {
                if (Math.abs(b.x - boss.x) < 70 && Math.abs(b.y - boss.y) < 40) {
                    boss.hp -= 2; createExplosion(b.x, b.y, '#ff0055', 4); bullets.splice(bi, 1);
                    if (boss.hp <= 0) { gold += 500; score += 2000; boss = null; gameWin(); }
                }
            });
        }

        asteroids.forEach((a, i) => {
            a.y += a.speed; a.angle += a.rotSpeed;
            if (a.y > canvas.height - 30) {
                earthHealth -= Math.round(a.size / 2); createExplosion(a.x, a.y, '#ff3300', 12); asteroids.splice(i, 1); updateHUD();
                if (earthHealth <= 0) gameOver();
            }
            bullets.forEach((b, bi) => {
                if (Math.hypot(a.x - b.x, a.y - b.y) < a.size) {
                    a.hp--; createExplosion(b.x, b.y, '#00f0ff', 3); bullets.splice(bi, 1);
                    if (a.hp <= 0) {
                        createExplosion(a.x, a.y, a.type === 'fire' ? '#ff4400' : '#aaa', 10);
                        coins.push({ x: a.x, y: a.y, amount: Math.round(a.size / 3), vy: 1.5 });
                        score += 20; asteroids.splice(i, 1); updateHUD();
                    }
                }
            });
        });

        particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.alpha -= 0.02; if (p.alpha <= 0) particles.splice(i, 1); });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 30; i++) ctx.fillRect((Math.sin(i * 99 + Date.now() * 0.0001) * 0.5 + 0.5) * canvas.width, (Math.cos(i * 33 + Date.now() * 0.0002) * 0.5 + 0.5) * canvas.height, 2, 2);
        
        ctx.fillStyle = 'rgba(0, 120, 255, 0.3)'; ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
        ctx.fillStyle = '#00ffff'; bullets.forEach(b => ctx.fillRect(b.x - 2, b.y, 4, 12));
        ctx.fillStyle = '#ffd700'; coins.forEach(c => { ctx.beginPath(); ctx.arc(c.x, c.y, 6, 0, Math.PI * 2); ctx.fill(); });
        
        asteroids.forEach(a => {
            ctx.save(); ctx.translate(a.x, a.y); ctx.rotate(a.angle);
            ctx.fillStyle = a.type === 'fire' ? '#ff4400' : (a.type === 'ice' ? '#00d2ff' : (a.type === 'armored' ? '#555' : '#889'));
            ctx.beginPath(); ctx.arc(0, 0, a.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        });

        if (boss) boss.draw();
        particles.forEach(p => { ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.globalAlpha = 1; });
        if (gameState === 'PLAYING') ship.draw();
    }

    function updateHUD() {
        document.getElementById('healthBar').style.width = `${Math.max(0, earthHealth)}%`;
        document.getElementById('scoreTxt').innerText = score;
        document.getElementById('goldTxt').innerText = gold;
        document.getElementById('levelTxt').innerText = level;
    }

    function openShop() { if (gameState === 'PLAYING') { gameState = 'PAUSED'; document.getElementById('shopOverlay').style.display = 'flex'; } }
    function closeShop() { document.getElementById('shopOverlay').style.display = 'none'; gameState = 'PLAYING'; }

    function buyUpgrade(type) {
        if (type === 'fireRate' && gold >= 50) { gold -= 50; ship.fireRate = Math.max(150, ship.fireRate - 60); }
        else if (type === 'doubleLaser' && gold >= 150 && !ship.hasDoubleLaser) { gold -= 150; ship.hasDoubleLaser = true; document.getElementById('buyDoubleLaser').disabled = true; }
        else if (type === 'speed' && gold >= 40) { gold -= 40; ship.speed += 1.5; }
        else if (type === 'repair' && gold >= 80) { gold -= 80; earthHealth = Math.min(100, earthHealth + 30); }
        updateHUD();
    }

    function gameOver() {
        gameState = 'GAMEOVER'; document.getElementById('overlayTitle').innerText = "DÜNYA YOK OLDU!";
        document.getElementById('overlayTitle').style.color = "#ff0055"; document.getElementById('overlay').style.display = 'flex';
    }

    function gameWin() {
        gameState = 'GAMEOVER'; document.getElementById('overlayTitle').innerText = "ZAFER!";
        document.getElementById('overlayTitle').style.color = "#00ff88"; document.getElementById('overlay').style.display = 'flex';
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    setInterval(spawnAsteroid, 1800);
    loop();
</script>
</body>
</html>
